name: smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke E2E del stack
    runs-on: ubuntu-latest
    # Construye 4 imagenes, baja mongo y ollama, y corre un modelo contra
    # ollama. Es lento a proposito: el punto es el arranque en frio completo.
    timeout-minutes: 45

    steps:
      - name: Checkout de la infra
        uses: actions/checkout@v4

      # El compose resuelve los contextos de build como ../pdf-extractext-*, es
      # decir hermanos de este repo. Si no estan, `docker compose up` no falla
      # por config: falla al no encontrar el Dockerfile.
      - name: Clonar los repos de servicios
        env:
          # El PR de migración comprueba las cuatro ramas propuestas en conjunto.
          # En main y en los demás PRs se sigue usando el código integrado.
          INTEGRATION_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/demo-automation-and-proxy-resilience-20261105' }}
        run: |
          set -euo pipefail
          for repo in validation extraction persistence summary; do
            git clone --depth 1 \
              "https://github.com/${{ github.repository_owner }}/pdf-extractext-${repo}.git" \
              "../pdf-extractext-${repo}"
            if [[ "$INTEGRATION_PR" == "true" ]]; then
              case "$repo" in
                validation) branch=refactor/layered-validation-20261105 ;;
                extraction) branch=refactor/layered-extraction-20261105 ;;
                persistence) branch=refactor/layered-persistence-20261105 ;;
                summary) branch=test/summary-readiness-and-demo-20261105 ;;
              esac
              git -C "../pdf-extractext-${repo}" fetch --depth 1 origin "$branch"
              git -C "../pdf-extractext-${repo}" checkout --detach FETCH_HEAD
              echo "$repo -> $branch"
            fi
          done
          ls -1 ..

      # El compose exige estas variables (no hay defaults), asi que sin esto el
      # stack ni siquiera resuelve.
      - name: Crear .env de credenciales
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '
            $pw = [guid]::NewGuid().ToString("N") + "aA1!"
            @(
              "MONGODB_ROOT_USERNAME=extractext_ci"
              "MONGODB_ROOT_PASSWORD=$pw"
            ) | Set-Content -LiteralPath .env
          '

      # Consul requiere tokens UUID estables por instalacion; nunca se suben.
      - name: Preparar tokens ACL y certificados desde Python
        run: python3 scripts/dev.py prepare

      # traefik monta ./certs y el par no esta en git.
      - name: Generar certificados TLS
        run: pwsh -NoProfile -File ./scripts/generate_certs.ps1

      - name: Mostrar recursos del runner
        run: |
          docker compose version
          free -h || true
          nproc

      # Los nombres de Traefik no están en /etc/hosts del runner y que el
      # resolver expanda *.localhost depende de la distro. Fijarlos hace el
      # smoke determinista: sin esto, un fallo de DNS se ve como un 502 del
      # proxy y no como lo que es.
      - name: Resolver los hosts de Traefik a localhost
        run: |
          echo "127.0.0.1 validation.pdf.localhost extraction.pdf.localhost persistence.pdf.localhost summary.pdf.localhost traefik.localhost" \
            | sudo tee -a /etc/hosts

      - name: Correr smoke test E2E y recuperación
        run: pwsh -NoProfile -File ./scripts/smoke_test.ps1 -CheckRecovery

      # El script ya baja el stack en su finally. Esto es una red de seguridad:
      # si el runner se cae a mitad de camino, el job no debe dejar el job
      # siguiente (o el cleanup del runner) esperando.
      - name: Asegurar stack abajo
        if: always()
        run: |
          docker compose -f docker-compose.yml down --remove-orphans || true
          docker network rm mired || true
