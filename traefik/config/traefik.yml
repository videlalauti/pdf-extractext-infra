api:
  dashboard: true
  insecure: false

ping:
  entryPoint: internal

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  # Solo escucha dentro de Docker; NO se publica al host.
  internal:
    address: ":8081"

providers:
  file:
    filename: /etc/traefik/config.yml
    watch: true
  # Rutas de microservicios descubiertas desde Consul, no desde Docker.
  consulCatalog:
    endpoint:
      address: consul:8500
      # start.sh inyecta el UUID desde .env en un archivo privado, nunca en Git.
      token: "__CONSUL_TRAEFIK_TOKEN__"
    exposedByDefault: false
    strictChecks:
      - passing
    # Los servicios arrancan DESPUES del proxy: forzar sondeo evita
    # quedar con un Catalog vacio si el watch no notifica el registro.
    watch: false
    refreshInterval: 5s

tls:
  certificates:
    - certFile: /etc/certs/cert.pem
      keyFile: /etc/certs/key.pem

log:
  level: INFO

# Access log: sin esto no hay forma de saber que pidio cada cliente ni cuanto
# tardo. Se escribe a stdout y lo rota el driver json-file del compose.
# Sin filtros a proposito: filtrar por status deja fuera el trafico que si
# importa (los 200 de la API).
accessLog:
  format: json
