# Ancla local: los anchors de YAML no cruzan archivos.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
    reverse-proxy:
        # Version exacta por digest. Con el tag suelto (`v3.6`) un rebuild
        # dentro de seis meses puede traer otro binario sin que nadie lo note.
        image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
        container_name: traefik
        restart: unless-stopped
        logging: *logging
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        security_opt:
            - no-new-privileges:true
        ports:
            - 80:80
            - 443:443
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
            - ./config/config.yml:/etc/traefik/config.yml:ro
            - ./certs:/etc/certs:ro
        networks:
            - mired
networks:
    mired:
        external: true
