# Los anchors de YAML no cruzan archivos: esta ancla es la copia local de la
# que vive en el compose raiz.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        logging: *logging
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        # Puerto de datos solo en la red de servicios: los servicios le hablan
        # por `redis:6379`. Para depurar desde el host:
        # docker compose exec redis redis-cli ping
        expose:
            - "6379"
        # Summary conserva aqui jobs y resultados. AOF y volumen permiten
        # recuperar el estado tras reinicios; Redis sigue sin ser un archivo
        # definitivo de resultados a largo plazo.
        command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 10s
        networks:
            - mired

volumes:
    redis-data:

networks:
    mired:
        external: true
