include:
  - traefik/docker-compose.yml
  - mongodb/docker-compose.yml

x-traefik-labels: &traefik-labels
  traefik.enable: "true"
  traefik.http.routers..entrypoints: web
  traefik.http.services..loadbalancer.server.port: "8000"

services:
  validation-service:
    build: ../pdf-extractext-validation
    container_name: validation-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    labels:
      <<: *traefik-labels
      traefik.http.routers..rule: "Host(`validation.pdf.localhost`)"
    networks:
      - mired

  extraction-service:
    build: ../pdf-extractext-extraction
    container_name: extraction-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - PERSISTENCE_SERVICE_URL=http://persistence-service:8000
    labels:
      <<: *traefik-labels
      traefik.http.routers..rule: "Host(`extraction.pdf.localhost`)"
    networks:
      - mired

  persistence-service:
    build: ../pdf-extractext-persistence
    container_name: persistence-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    # Las credenciales llegan por .env con los mismos nombres que usa mongo:
    # no hay defaults que puedan quedar desincronizados entre si.
    env_file:
      - ./.env
    environment:
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_DATABASE_NAME=pdf_extractext
      - MONGODB_AUTH_SOURCE=admin
    labels:
      <<: *traefik-labels
      traefik.http.routers..rule: "Host(`persistence.pdf.localhost`)"
    networks:
      - mired
    depends_on:
      mongo:
        condition: service_healthy

  summary-service:
    build: ../pdf-extractext-summary
    container_name: summary-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - PERSISTENCE_SERVICE_URL=http://persistence-service:8000
      - OLLAMA_URL=http://ollama:11434
    labels:
      <<: *traefik-labels
      traefik.http.routers..rule: "Host(`summary.pdf.localhost`)"
    networks:
      - mired

  ollama:
    image: ollama/ollama:0.34.4
    container_name: ollama
    restart: unless-stopped
    # Puerto de datos solo en la red interna; el host no lo necesita.
    # Para depurar: docker compose exec ollama ollama list
    expose:
      - "11434"
    environment:
      # Configurable por entorno (12-Factor); 32768 es el default para PDFs largos.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mired

volumes:
  ollama-data:

networks:
  mired:
    external: true
